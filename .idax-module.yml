schemaVersion: 1
contractVersion: 1
scaffoldVersion: 1
module:
  key: ostris
  productName: osTRIS
technical:
  javaPackage: es.idynamicsax.ostris
  postgresSchema: ostris
  apiPrefix: /api/ostris
components:
  backend: backend
  frontend: frontend
  main: deployment
permissions:
  - code: OSTRIS_COMMUNITY_MANAGE
    resourceKey: ostris.community
    fieldKey: null
    actionKey: manage
    labelKey: ostris.permissions.community.manage
    apiPath: /api/ostris/communities
    description: Create communities and units of account through the application API.
  - code: OSTRIS_CREDENTIAL_MANAGE
    resourceKey: ostris.credential
    fieldKey: null
    actionKey: manage
    labelKey: ostris.permissions.credential.manage
    apiPath: /api/ostris/communities/*/credentials/**
    description: Add or revoke a credential for an already-active controller through the application API (device lifecycle).
  - code: OSTRIS_DISCOVERY_READ
    resourceKey: ostris.discovery
    fieldKey: null
    actionKey: read
    labelKey: ostris.permissions.discovery.read
    apiPath: /api/ostris/communities/**
    description: Read public community, unit, account balance and credential information through the application API.
  - code: OSTRIS_IDENTITY_CONTINUITY_MANAGE
    resourceKey: ostris.identity-continuity
    fieldKey: null
    actionKey: manage
    labelKey: ostris.permissions.identity-continuity.manage
    apiPath: /api/ostris/identity/continuity-decisions
    description: Invoke application operations that create identity continuity decisions.
  - code: OSTRIS_IDENTITY_CONTINUITY_READ_PRIVATE
    resourceKey: ostris.identity-continuity
    fieldKey: null
    actionKey: read-private
    labelKey: ostris.permissions.identity-continuity.read-private
    apiPath: /api/ostris/identity/communities/*/participants/*/continuity
    description: Read private identity continuity decisions through the application API.
  - code: OSTRIS_LEDGER_OUTBOX_REPLAY
    resourceKey: ostris.ledger-outbox
    fieldKey: null
    actionKey: replay
    labelKey: ostris.permissions.ledger-outbox.replay
    apiPath: /api/ostris/admin/ledger-outbox/*/replay
    description: Replay a terminal (FAILED_PERMANENT) ledger delivery after its root cause has been fixed, as a reviewed, explicit, human-operator action.
  - code: OSTRIS_PARTICIPANT_ACTIVATE
    resourceKey: ostris.participant
    fieldKey: null
    actionKey: activate
    labelKey: ostris.permissions.participant.activate
    apiPath: /api/ostris/communities/*/participants/activate
    description: Provision a participant, account, credential and 1-of-1 account control policy for the caller through the application API.
  - code: OSTRIS_READ
    resourceKey: ostris.participant
    fieldKey: null
    actionKey: read
    labelKey: ostris.permissions.participant.read
    apiPath: /api/ostris/participants/*/*
    description: Read public participant information through the application API.
  - code: OSTRIS_TRANSACTION_AUTHORIZE
    resourceKey: ostris.transaction
    fieldKey: null
    actionKey: authorize
    labelKey: ostris.permissions.transaction.authorize
    apiPath: null
    description: Submit account or governance authorization evidence through transaction application operations.
  - code: OSTRIS_TRANSACTION_COMMIT
    resourceKey: ostris.transaction
    fieldKey: null
    actionKey: commit
    labelKey: ostris.permissions.transaction.commit
    apiPath: /api/ostris/transactions/*/commit
    description: Invoke the transaction commit application operation after all protocol rules are satisfied.
  - code: OSTRIS_TRANSACTION_CREATE
    resourceKey: ostris.transaction
    fieldKey: null
    actionKey: create
    labelKey: ostris.permissions.transaction.create
    apiPath: /api/ostris/transactions/proposals
    description: Create transaction proposals through the application API.
  - code: OSTRIS_TRANSACTION_READ
    resourceKey: ostris.transaction
    fieldKey: null
    actionKey: read
    labelKey: ostris.permissions.transaction.read
    apiPath: /api/ostris/transactions/*
    description: Read transaction proposal/commit status, the canonical authorization payload to sign, and authorized-account progress.
generator:
  directory: backend/scripts/gen-idax-ostris
  config: backend/scripts/gen-idax-ostris/table-config.yml
  command:
  - python3
  - scripts/gen-idax-ostris/gen-idax-ostris.py
validation:
  backend:
    command: [mvn, test]
  frontend:
    command: [npm, test]
